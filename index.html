<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Waterfall</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F5F2ED;
            background-image: url('waterfall_graphic.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 320px;
            height: 240px;
            display: none;
        }

        .controls {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        button {
            background: #2A2A2A;
            color: #F5F2ED;
            border: none;
            padding: 16px 32px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        button:hover {
            background: #3A3A3A;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background: #4A6FA5;
        }

        .signature {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 10px;
            letter-spacing: 2px;
            color: #2A2A2A;
            opacity: 0.6;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #2A2A2A;
            font-size: 14px;
            letter-spacing: 1px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        <video id="video" playsinline></video>
        <div id="loading">Initializing hand tracking...</div>

        <div class="controls">
            <button id="startBtn">Start Waterfall</button>
            <button id="cameraBtn">Enable Camera</button>
        </div>

        <div class="signature">DAMINONVEC</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const cameraBtn = document.getElementById('cameraBtn');
        const loading = document.getElementById('loading');

        let width, height;
        let waterfallActive = false;
        let cameraActive = false;
        let particles = [];
        let hands = null;
        let camera = null;
        let handPositions = [];

        // Resize canvas to fill window
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Centered waterfall configuration (no black panels)
        const waterfallShape = {
            waterfallX: width * 0.465,  // Center the waterfall
            waterfallWidth: width * 0.07,
            startY: height * 0.15,
            endY: height * 0.85
        };

        // Update shape on resize
        function updateShapePosition() {
            waterfallShape.waterfallX = width * 0.465;
            waterfallShape.waterfallWidth = width * 0.07;
            waterfallShape.startY = height * 0.15;
            waterfallShape.endY = height * 0.85;
        }

        // Line-based waterfall system matching reference image
        class WaterLine {
            constructor(x, index) {
                this.baseX = x;
                this.x = x;
                this.index = index;
                this.offset = 0;
                this.targetOffset = 0;
                this.points = [];
                this.initPoints();
            }

            initPoints() {
                // Create points along the line for curved displacement
                const startY = waterfallShape.startY;
                const endY = waterfallShape.endY;
                const segments = 30;

                this.points = [];
                for (let i = 0; i <= segments; i++) {
                    const t = i / segments;
                    const y = startY + (endY - startY) * t;
                    this.points.push({
                        y: y,
                        offsetX: 0,
                        targetOffsetX: 0
                    });
                }
            }

            update() {
                // Smooth interpolation for each point
                this.points.forEach(point => {
                    point.offsetX += (point.targetOffsetX - point.offsetX) * 0.08;
                    // Decay back to center
                    point.targetOffsetX *= 0.95;
                });
            }

            applyHandInfluence(hx, hy, strength) {
                this.points.forEach(point => {
                    const dx = (this.baseX + point.offsetX) - hx;
                    const dy = point.y - hy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const influenceRadius = 150;

                    if (dist < influenceRadius && dist > 0) {
                        const force = (1 - dist / influenceRadius) * strength;
                        point.targetOffsetX += (dx / dist) * force * 20;
                    }
                });
            }

            draw() {
                if (!waterfallActive) return;

                ctx.save();

                // Create smooth curved path through points
                ctx.beginPath();
                ctx.moveTo(this.baseX + this.points[0].offsetX, this.points[0].y);

                for (let i = 1; i < this.points.length; i++) {
                    const x = this.baseX + this.points[i].offsetX;
                    const y = this.points[i].y;

                    if (i === 1) {
                        ctx.lineTo(x, y);
                    } else {
                        // Smooth curve using previous point as control
                        const prevX = this.baseX + this.points[i - 1].offsetX;
                        const prevY = this.points[i - 1].y;
                        const cpX = (prevX + x) / 2;
                        const cpY = (prevY + y) / 2;
                        ctx.quadraticCurveTo(prevX, prevY, cpX, cpY);
                    }
                }

                // Line styling with graphic variation
                const baseWidth = 3.0;
                const variation = Math.sin(this.index * 0.7) * 0.6;
                const lineWidth = baseWidth + variation;
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // Graphic color matching reference
                const opacity = 0.88 + Math.sin(this.index * 0.3) * 0.1;
                const lightness = 190 + Math.sin(this.index * 0.4) * 10;
                ctx.strokeStyle = `rgba(${lightness}, ${lightness + 10}, ${lightness + 20}, ${opacity})`;

                ctx.stroke();

                // Add subtle texture by drawing slightly offset shadow
                if (this.index % 2 === 0) {
                    ctx.globalAlpha = 0.15;
                    ctx.lineWidth = lineWidth * 1.3;
                    ctx.strokeStyle = `rgba(160, 175, 195, 0.3)`;
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        // Draw simplified two-panel shape matching reference image
        function drawWaterfallShape() {
            ctx.save();
            ctx.fillStyle = '#1A1A1A';

            // Left panel
            const left = waterfallShape.leftPanel;
            ctx.beginPath();
            ctx.moveTo(left.x, left.y + left.height * 0.15);
            // Top curve
            ctx.bezierCurveTo(
                left.x, left.y,
                left.x + left.width, left.y,
                left.x + left.width, left.y + left.height * 0.1
            );
            // Right edge
            ctx.lineTo(left.x + left.width, left.y + left.height);
            // Bottom
            ctx.lineTo(left.x, left.y + left.height);
            // Left edge
            ctx.closePath();
            ctx.fill();

            // Right panel
            const right = waterfallShape.rightPanel;
            ctx.beginPath();
            ctx.moveTo(right.x, right.y + right.height * 0.1);
            // Top curve
            ctx.bezierCurveTo(
                right.x, right.y,
                right.x + right.width, right.y,
                right.x + right.width, right.y + right.height * 0.15
            );
            // Right edge
            ctx.lineTo(right.x + right.width, right.y + right.height);
            // Bottom
            ctx.lineTo(right.x, right.y + right.height);
            // Left edge
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // Initialize water lines matching reference image
        let waterLines = [];
        let revealProgress = 0; // 0 to 1, controls gradual reveal from top to bottom
        const revealSpeed = 0.015; // Speed of the reveal animation
        let waterLevel = 0; // Height of accumulated water at bottom
        const maxWaterLevel = 0.25; // Maximum water level as fraction of canvas height
        const waterRiseSpeed = 0.008; // Speed of water level rising

        function initWaterLines() {
            waterLines = [];
            const numLines = 8; // Number of parallel lines
            const startX = waterfallShape.waterfallX;
            const lineSpacing = waterfallShape.waterfallWidth / (numLines - 1);

            for (let i = 0; i < numLines; i++) {
                const x = startX + (i * lineSpacing);
                waterLines.push(new WaterLine(x, i));
            }

            // Reset reveal progress and water level when initializing
            revealProgress = 0;
            waterLevel = 0;
        }

        // Update and draw water lines
        function updateWaterLines() {
            // Animate reveal progress
            if (revealProgress < 1) {
                revealProgress = Math.min(1, revealProgress + revealSpeed);
            } else {
                // Once reveal is complete, start raising water level
                if (waterLevel < maxWaterLevel) {
                    waterLevel = Math.min(maxWaterLevel, waterLevel + waterRiseSpeed);
                }
            }

            // Apply hand influence
            if (handPositions.length > 0) {
                handPositions.forEach(hand => {
                    waterLines.forEach(line => {
                        line.applyHandInfluence(hand.x, hand.y, 1.0);
                    });
                });
            }

            // Calculate reveal mask position
            const startY = waterfallShape.startY;
            const endY = waterfallShape.endY;
            const revealY = startY + (endY - startY) * revealProgress;

            // Apply clipping mask for gradual reveal
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, width, revealY);
            ctx.clip();

            // Update and draw each line
            waterLines.forEach(line => {
                line.update();
                line.draw();
            });

            ctx.restore();
        }

        // Draw accumulated water at the bottom
        function drawAccumulatedWater() {
            if (waterLevel <= 0) return;

            const waterHeight = height * waterLevel;
            const waterTop = height - waterHeight;

            ctx.save();

            // Create water shape with subtle waves
            ctx.beginPath();
            ctx.moveTo(0, height);

            // Draw wavy top surface
            const wavePoints = 50;
            for (let i = 0; i <= wavePoints; i++) {
                const x = (width / wavePoints) * i;
                const waveOffset = Math.sin(i * 0.3 + Date.now() * 0.001) * 3;
                const y = waterTop + waveOffset;

                if (i === 0) {
                    ctx.lineTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.lineTo(width, height);
            ctx.closePath();

            // Fill with gradient
            const gradient = ctx.createLinearGradient(0, waterTop, 0, height);
            gradient.addColorStop(0, 'rgba(168, 188, 210, 0.3)');
            gradient.addColorStop(0.3, 'rgba(180, 195, 215, 0.35)');
            gradient.addColorStop(1, 'rgba(185, 200, 220, 0.4)');
            ctx.fillStyle = gradient;
            ctx.fill();

            // Add subtle highlight at the top
            ctx.strokeStyle = 'rgba(200, 210, 225, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i <= wavePoints; i++) {
                const x = (width / wavePoints) * i;
                const waveOffset = Math.sin(i * 0.3 + Date.now() * 0.001) * 3;
                const y = waterTop + waveOffset;

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();

            ctx.restore();
        }

        // Hand tracking setup
        function setupHandTracking() {
            loading.style.display = 'block';

            hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandResults);

            camera = new Camera(video, {
                onFrame: async () => {
                    if (cameraActive) {
                        await hands.send({ image: video });
                    }
                },
                width: 640,
                height: 480
            });

            camera.start().then(() => {
                loading.style.display = 'none';
            }).catch(err => {
                console.error('Camera error:', err);
                loading.textContent = 'Camera access denied';
                setTimeout(() => {
                    loading.style.display = 'none';
                }, 2000);
            });
        }

        // Process hand tracking results
        function onHandResults(results) {
            handPositions = [];

            if (results.multiHandLandmarks) {
                results.multiHandLandmarks.forEach(landmarks => {
                    // Use palm center (landmark 9)
                    const palmCenter = landmarks[9];

                    // Convert from normalized coordinates to canvas coordinates
                    // Note: MediaPipe gives mirrored coordinates
                    const x = (1 - palmCenter.x) * width;
                    const y = palmCenter.y * height;

                    handPositions.push({ x, y });
                });
            }
        }

        // Main animation loop
        function animate() {
            // Clear canvas with semi-transparent fill to allow background image to show
            ctx.clearRect(0, 0, width, height);

            // Draw accumulated water at bottom
            if (waterfallActive) {
                drawAccumulatedWater();
            }

            // Update and draw water lines
            if (waterfallActive) {
                updateWaterLines();
            }

            // Draw subtle hand interaction indicator
            if (cameraActive && handPositions.length > 0 && waterfallActive) {
                ctx.save();
                handPositions.forEach(hand => {
                    // Subtle ripple effect
                    const gradient = ctx.createRadialGradient(hand.x, hand.y, 0, hand.x, hand.y, 100);
                    gradient.addColorStop(0, 'rgba(180, 195, 215, 0.12)');
                    gradient.addColorStop(0.5, 'rgba(180, 195, 215, 0.05)');
                    gradient.addColorStop(1, 'rgba(180, 195, 215, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(hand.x, hand.y, 100, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        // Event listeners
        startBtn.addEventListener('click', () => {
            waterfallActive = !waterfallActive;
            startBtn.textContent = waterfallActive ? 'Stop Waterfall' : 'Start Waterfall';

            if (waterfallActive && waterLines.length === 0) {
                initWaterLines();
            }
        });

        cameraBtn.addEventListener('click', () => {
            cameraActive = !cameraActive;
            cameraBtn.classList.toggle('active');
            cameraBtn.textContent = cameraActive ? 'Disable Camera' : 'Enable Camera';

            if (cameraActive && !hands) {
                setupHandTracking();
            } else if (!cameraActive) {
                handPositions = [];
            }
        });

        // Update shape on window resize
        window.addEventListener('resize', () => {
            resizeCanvas();
            updateShapePosition();
            if (waterfallActive) {
                initWaterLines();
            }
        });

        // Start animation loop
        animate();
    </script>
</body>
</html>
