<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Waterfall</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F5F2ED;
            background-image: url('waterfall_graphic.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 320px;
            height: 240px;
            display: none;
        }

        .controls {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        button {
            background: #2A2A2A;
            color: #F5F2ED;
            border: none;
            padding: 16px 32px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        button:hover {
            background: #3A3A3A;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background: #4A6FA5;
        }

        .signature {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 10px;
            letter-spacing: 2px;
            color: #2A2A2A;
            opacity: 0.6;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #2A2A2A;
            font-size: 14px;
            letter-spacing: 1px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        <video id="video" playsinline></video>
        <div id="loading">Initializing hand tracking...</div>

        <div class="controls">
            <button id="startBtn">Start Waterfall</button>
            <button id="cameraBtn">Enable Camera</button>
        </div>

        <div class="signature">DAMINONVEC</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const cameraBtn = document.getElementById('cameraBtn');
        const loading = document.getElementById('loading');

        let width, height;
        let waterfallActive = false;
        let cameraActive = false;
        let particles = [];
        let pose = null;
        let camera = null;
        let bodyKeypoints = [];
        let bodySilhouette = null;

        // Resize canvas to fill window
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Centered waterfall configuration (no black panels)
        const waterfallShape = {
            waterfallX: width * 0.465,  // Center the waterfall
            waterfallWidth: width * 0.07,
            startY: height * 0.15,
            endY: height * 0.85
        };

        // Update shape on resize
        function updateShapePosition() {
            waterfallShape.waterfallX = width * 0.465;
            waterfallShape.waterfallWidth = width * 0.07;
            waterfallShape.startY = height * 0.15;
            waterfallShape.endY = height * 0.85;
        }

        // Digital pixel-based waterfall particle system
        class DigitalParticle {
            constructor(x, y, lineIndex) {
                this.x = x;
                this.y = y;
                this.baseX = x;
                this.vx = 0;
                this.vy = 2 + Math.random() * 1;
                this.size = 3 + Math.random() * 2;
                this.opacity = 0.7 + Math.random() * 0.3;
                this.lineIndex = lineIndex;
                this.color = this.getColor();
                this.pushForce = { x: 0, y: 0 };
            }

            getColor() {
                const colors = [
                    'rgba(100, 180, 255, ',
                    'rgba(150, 200, 255, ',
                    'rgba(180, 220, 255, ',
                    'rgba(120, 190, 255, '
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                // Apply physics
                this.vy += 0.15;
                this.vx += this.pushForce.x;
                this.vy += this.pushForce.y;

                // Damping
                this.vx *= 0.92;

                // Gentle return to base X
                const returnForce = (this.baseX - this.x) * 0.02;
                this.vx += returnForce;

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Decay push force
                this.pushForce.x *= 0.85;
                this.pushForce.y *= 0.85;

                // Check if out of bounds
                return this.y < height + 50;
            }

            applyBodyInfluence(silhouetteData) {
                if (!silhouetteData) return;

                const px = Math.floor(this.x);
                const py = Math.floor(this.y);

                if (px >= 0 && px < width && py >= 0 && py < height) {
                    const index = (py * width + px) * 4;
                    const alpha = silhouetteData[index + 3];

                    // If particle is inside body silhouette
                    if (alpha > 50) {
                        // Push particles away from center of mass
                        const repelStrength = 4;
                        this.pushForce.x += (Math.random() - 0.5) * repelStrength;
                        this.pushForce.y += -1;
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;

                // Draw digital pixel
                ctx.fillStyle = this.color + this.opacity + ')';
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);

                // Add glow effect
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color + '0.8)';
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);

                ctx.restore();
            }
        }

        // Initialize digital particles
        let particles = [];
        let revealProgress = 0;
        const revealSpeed = 0.015;
        let waterLevel = 0;
        const maxWaterLevel = 0.25;
        const waterRiseSpeed = 0.008;

        function spawnParticles() {
            if (!waterfallActive) return;

            const numStreams = 12;
            const particlesPerStream = 2;
            const startX = waterfallShape.waterfallX;
            const streamWidth = waterfallShape.waterfallWidth;

            for (let i = 0; i < numStreams; i++) {
                const x = startX + (streamWidth / (numStreams - 1)) * i;
                const startY = waterfallShape.startY;

                for (let j = 0; j < particlesPerStream; j++) {
                    const px = x + (Math.random() - 0.5) * 5;
                    const py = startY + Math.random() * 20;
                    particles.push(new DigitalParticle(px, py, i));
                }
            }

            // Limit particle count
            if (particles.length > 800) {
                particles = particles.slice(-800);
            }
        }

        // Update and draw particles
        function updateParticles() {
            // Animate reveal progress
            if (revealProgress < 1) {
                revealProgress = Math.min(1, revealProgress + revealSpeed);
            } else {
                if (waterLevel < maxWaterLevel) {
                    waterLevel = Math.min(maxWaterLevel, waterLevel + waterRiseSpeed);
                }
            }

            // Get body silhouette data if camera is active
            let silhouetteData = null;
            if (cameraActive && bodySilhouette) {
                silhouetteData = bodySilhouette.data;
            }

            // Update particles
            particles = particles.filter(p => {
                if (silhouetteData) {
                    p.applyBodyInfluence(silhouetteData);
                }
                return p.update();
            });

            // Calculate reveal mask
            const revealY = waterfallShape.startY + (waterfallShape.endY - waterfallShape.startY) * revealProgress;

            // Draw with clipping
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, width, revealY);
            ctx.clip();

            particles.forEach(p => p.draw());

            ctx.restore();
        }

        // Draw accumulated water at the bottom
        function drawAccumulatedWater() {
            if (waterLevel <= 0) return;

            const waterHeight = height * waterLevel;
            const waterTop = height - waterHeight;

            ctx.save();

            // Create water shape with subtle waves
            ctx.beginPath();
            ctx.moveTo(0, height);

            // Draw wavy top surface
            const wavePoints = 50;
            for (let i = 0; i <= wavePoints; i++) {
                const x = (width / wavePoints) * i;
                const waveOffset = Math.sin(i * 0.3 + Date.now() * 0.001) * 3;
                const y = waterTop + waveOffset;

                if (i === 0) {
                    ctx.lineTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.lineTo(width, height);
            ctx.closePath();

            // Fill with gradient
            const gradient = ctx.createLinearGradient(0, waterTop, 0, height);
            gradient.addColorStop(0, 'rgba(168, 188, 210, 0.3)');
            gradient.addColorStop(0.3, 'rgba(180, 195, 215, 0.35)');
            gradient.addColorStop(1, 'rgba(185, 200, 220, 0.4)');
            ctx.fillStyle = gradient;
            ctx.fill();

            // Add subtle highlight at the top
            ctx.strokeStyle = 'rgba(200, 210, 225, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i <= wavePoints; i++) {
                const x = (width / wavePoints) * i;
                const waveOffset = Math.sin(i * 0.3 + Date.now() * 0.001) * 3;
                const y = waterTop + waveOffset;

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();

            ctx.restore();
        }

        // Body pose tracking setup
        function setupBodyTracking() {
            loading.style.display = 'block';
            loading.textContent = 'Initializing body tracking...';

            pose = new Pose({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
                }
            });

            pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                enableSegmentation: true,
                smoothSegmentation: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            pose.onResults(onPoseResults);

            camera = new Camera(video, {
                onFrame: async () => {
                    if (cameraActive) {
                        await pose.send({ image: video });
                    }
                },
                width: 640,
                height: 480
            });

            camera.start().then(() => {
                loading.style.display = 'none';
            }).catch(err => {
                console.error('Camera error:', err);
                loading.textContent = 'Camera access denied';
                setTimeout(() => {
                    loading.style.display = 'none';
                }, 2000);
            });
        }

        // Process pose tracking results
        function onPoseResults(results) {
            bodyKeypoints = [];

            if (results.poseLandmarks) {
                // Convert landmarks to canvas coordinates
                results.poseLandmarks.forEach(landmark => {
                    const x = (1 - landmark.x) * width; // Mirror horizontally
                    const y = landmark.y * height;
                    bodyKeypoints.push({ x, y, z: landmark.z });
                });
            }

            // Create body silhouette from segmentation mask
            if (results.segmentationMask) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = width;
                tempCanvas.height = height;
                const tempCtx = tempCanvas.getContext('2d');

                // Draw segmentation mask
                tempCtx.drawImage(results.segmentationMask, 0, 0, width, height);
                bodySilhouette = tempCtx.getImageData(0, 0, width, height);
            }
        }

        // Main animation loop
        function animate() {
            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            // Draw accumulated water at bottom
            if (waterfallActive) {
                drawAccumulatedWater();
            }

            // Spawn and update particles
            if (waterfallActive) {
                spawnParticles();
                updateParticles();
            }

            // Draw body silhouette outline for visual feedback (optional)
            if (cameraActive && bodyKeypoints.length > 0 && waterfallActive) {
                ctx.save();
                ctx.strokeStyle = 'rgba(100, 180, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);

                // Draw simple body outline
                ctx.beginPath();
                bodyKeypoints.forEach((point, i) => {
                    if (i === 0) {
                        ctx.moveTo(point.x, point.y);
                    } else {
                        ctx.lineTo(point.x, point.y);
                    }
                });
                ctx.stroke();
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        // Event listeners
        startBtn.addEventListener('click', () => {
            waterfallActive = !waterfallActive;
            startBtn.textContent = waterfallActive ? 'Stop Waterfall' : 'Start Waterfall';

            if (!waterfallActive) {
                particles = [];
                revealProgress = 0;
                waterLevel = 0;
            }
        });

        cameraBtn.addEventListener('click', () => {
            cameraActive = !cameraActive;
            cameraBtn.classList.toggle('active');
            cameraBtn.textContent = cameraActive ? 'Disable Camera' : 'Enable Camera';

            if (cameraActive && !pose) {
                setupBodyTracking();
            } else if (!cameraActive) {
                bodyKeypoints = [];
                bodySilhouette = null;
            }
        });

        // Update shape on window resize
        window.addEventListener('resize', () => {
            resizeCanvas();
            updateShapePosition();
        });

        // Start animation loop
        animate();
    </script>
</body>
</html>
